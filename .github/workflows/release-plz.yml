name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Both jobs authenticate with a personal access token rather than the default
# `GITHUB_TOKEN`, because GitHub refuses to start a workflow run from an event
# created by the default token, which would leave the release pull request
# without a CI run.
jobs:
  # Publishes to crates.io, tags `vX.Y.Z` and creates a GitHub release, but only
  # once a release pull request has landed and raised the manifest version.
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}

  # Opens or updates a "chore: release vX.Y.Z" pull request containing the
  # version bump and the generated changelog. Nothing is ever committed to main
  # directly.
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
